# Scriberr on Hermes -- RTX 3080 (Ampere, sm_86), Debian trixie under WSL2.
#
# This file is OURS. Upstream's docker-compose.cuda.yml is deliberately left
# untouched so `git fetch upstream && git merge` never conflicts over config
# that was only ever meant for one machine.
#
# Do NOT use upstream's docker-compose.cuda.yml as-is. As of Aug 2026 it is
# stale in two ways at once: it pins image `scriberr:v1.0.4-cuda` when the
# project is on v1.2.x, and that is also the wrong image REPOSITORY -- the
# README's canonical CUDA config uses `scriberr-cuda`. Upstream development is
# currently paused, so do not expect that file to be fixed.
#
# Image choice: `scriberr-cuda` is correct for GTX 10-series through RTX
# 40-series (sm_61 to sm_89). RTX 50-series Blackwell (sm_120) needs the
# separate `scriberr-cuda-blackwell` image instead -- relevant if this ever
# moves to Bacchus, which has an RTX 5060.
#
# Run with:
#   docker compose -f docker-compose.hermes.yml up -d
#   docker compose -f docker-compose.hermes.yml logs -f
#
# Ready signal:  msg="Scriberr is ready" url=http://0.0.0.0:8080

services:
  scriberr:
    image: ghcr.io/rishikanthc/scriberr-cuda:v1.2.0
    container_name: scriberr
    ports:
      - "8080:8080"
    volumes:
      # Named volumes, deliberately. Bind-mounting a Windows path (C:\, Y:\)
      # into this container breaks it: docker-entrypoint.sh runs as root,
      # chowns the data dirs to PUID/PGID, then drops privileges with gosu,
      # and that chown is meaningless on a Windows-hosted filesystem with no
      # real Linux ownership. It is also slow through the translation layer.
      # These live in /var/lib/docker/volumes inside the WSL2 VM.
      - scriberr_data:/app/data
      - env_data:/app/whisperx-env
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # MUST be 10001 on the CUDA image, NOT 1000. This is an upstream bug and
      # 1000 is the one value guaranteed to break it.
      #
      # Dockerfile.cuda builds appuser at uid/gid 10001 ("to avoid conflicts
      # with existing users in CUDA base image" -- Ubuntu 24.04 already has a
      # user at 1000). The plain CPU Dockerfile builds appuser at 1000. Both
      # images share ONE docker-entrypoint.sh, which hard-codes 1000 as the
      # default and skips the usermod when PUID=1000:
      #
      #   if [ "$target_uid" != "1000" ] || [ "$target_gid" != "1000" ]; then
      #       ...usermod appuser to target uid...
      #   else
      #       echo "Using default user (UID=1000, GID=1000)"   # no-op
      #   fi
      #   chown -R "$PUID:$PGID" /app/data /app/whisperx-env    # -> 1000:1000
      #   exec gosu appuser "$@"                                # -> runs as 10001
      #
      # Net effect with PUID=1000: dirs owned by 1000, process runs as 10001,
      # and SQLite cannot open its own database. It reports SQLITE_CANTOPEN,
      # which the Go driver surfaces as the misleading "out of memory (14)".
      # The README's "match your host UID" advice is right for the CPU image
      # and wrong for this one.
      #
      # Consequence to remember for Phase 4: files written into any bind-mounted
      # host path will be owned 10001:10001, not by hermes@Hermes (1000).
      - PUID=10001
      - PGID=10001
      # Upstream marks this DO NOT CHANGE. Leave it.
      - APP_ENV=production
      # Required because we reach this over plain HTTP on localhost, not HTTPS.
      # With APP_ENV=production the app defaults SECURE_COOKIES=true and then
      # refuses to send cookies over http, which presents as the app loading
      # fine but every waveform failing with "Unable to load audio stream".
      - SECURE_COOKIES=false

volumes:
  scriberr_data: {}
  env_data: {}
